<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://app.splus.ir/js/soroush-web-app.js"></script>
<title>بازی جنگ جهانی</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #e94560;
    --text: #eee;
    --hint: #888;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    text-align: center;
    padding: 40px 20px;
    margin: 0;
    min-height: 100vh;
  }
  h1 { color: var(--accent); font-size: 28px; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    margin: 20px auto;
    max-width: 400px;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 14px 40px;
    font-size: 18px;
    border-radius: 12px;
    margin-top: 20px;
    cursor: pointer;
    width: 100%;
  }
  button:active { opacity: 0.7; }
  #user-info {
    font-size: 14px;
    color: var(--hint);
    margin-top: 16px;
  }
</style>
</head>
<body>
  <h1>🎖️ جنگ جهانی</h1>
  <div class="card">
    <p>اینجا مینیاپ بازی جنگ جهانیه.</p>
    <p>یه کشور انتخاب کن، ارتش بساز و حمله کن!</p>
    <button onclick="startGame()">شروع بازی</button>
    <div id="user-info">در حال دریافت اطلاعات...</div>
  </div>

  <script>
    const wa = window.Soroush?.WebApp;
    const infoEl = document.getElementById('user-info');

    if (!wa) {
      infoEl.textContent = 'SDK سروش‌پلاس لود نشد.';
    } else {
      wa.ready();
      wa.expand();

      const user = wa.initDataUnsafe?.user;
      if (user) {
        infoEl.textContent = `خوش اومدی ${user.first_name || ''} (ID: ${user.id})`;
      } else {
        infoEl.textContent = 'کاربر شناسایی نشد.';
      }

      if (wa.themeParams?.bg_color) {
        document.documentElement.style.setProperty('--bg', wa.themeParams.bg_color);
      }
      if (wa.themeParams?.secondary_bg_color) {
        document.documentElement.style.setProperty('--card', wa.themeParams.secondary_bg_color);
      }
      if (wa.themeParams?.text_color) {
        document.documentElement.style.setProperty('--text', wa.themeParams.text_color);
      }
      if (wa.themeParams?.hint_color) {
        document.documentElement.style.setProperty('--hint', wa.themeParams.hint_color);
      }
      if (wa.themeParams?.button_color) {
        document.documentElement.style.setProperty('--accent', wa.themeParams.button_color);
      }

      wa.BackButton.onClick(() => wa.close());

      wa.onEvent('themeChanged', () => {
        console.log('Theme changed');
      });
    }

    function startGame() {
      if (wa) wa.HapticFeedback.impactOccurred('medium');
      alert('بازی به‌زودی راه‌اندازی می‌شه!');
    }
  </script>
</body>
</html>
